<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio 2025 Flipbook</title>
  <!-- DFlip CSS for styling and icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/css/dflip.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/css/themify-icons.css"/>
  <style>
    /* Base page styles */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #222; /* dark grey background */
      font-family: sans-serif;
    }

    /* Flipbook container should fill the page */
    #flipbookContainer {
      width: 100%;
      height: 100%;
    }

    /* Side arrow navigation styling */
    .side-nav-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 22px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(0,0,0,0.5);
      color: #fff;
      cursor: pointer;
      z-index: 10010;
      transition: background-color 0.2s ease, opacity 0.2s ease;
      opacity: 0.85;
    }
    .side-nav-btn:hover { background-color: rgba(0,0,0,0.7); opacity: 1; }
    .side-nav-btn:focus { outline: 2px solid #aaa; }
    .side-left { left: 12px; }
    .side-right { right: 12px; }
    .side-nav-btn i { font-size: 20px; line-height: 1; }

    /* Override DFlip toolbar to dark grey for better visibility */
    .df-ui-bar {
      background-color: #333 !important;
    }
    .df-ui-btn {
      color: #f5f5f5 !important;
      background-color: #444 !important;
    }
    .df-ui-btn:hover {
      background-color: #666 !important;
    }
  </style>
</head>
<body>
<!-- Flipbook container -->
<div class="_df_book" id="flipbookContainer" source="portfolio-2025.pdf" backgroundcolor="#333333"></div>

<!-- jQuery and DFlip scripts -->
<script src="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/js/libs/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/js/dflip.min.js"></script>

<!-- Configure DFlip and add custom navigation -->
<script>
  jQuery(function($){
    // Set global default options for DFlip
    DFLIP.defaults.backgroundColor = "#333333";
    // Disable WebGL 3D to avoid long loading issues (use 2D flipping)
    DFLIP.defaults.webgl = false;
    // Show DFlip's toolbar at the bottom
    DFLIP.defaults.controlsPosition = DFLIP.CONTROLSPOSITION.BOTTOM;

    // When flipbook is ready, add side arrows and toolbar arrows
    DFLIP.defaults.onReady = function(flipbook){
      // Helper guards
      var goPrev = function(){ if (flipbook && typeof flipbook.prev === 'function') flipbook.prev(); };
      var goNext = function(){ if (flipbook && typeof flipbook.next === 'function') flipbook.next(); };

      // 1) Side arrows (left/right of the viewport)
      var $leftBtn = $('<button class="side-nav-btn side-left" aria-label="Previous page" title="Previous (←)"><i class="ti-angle-left"></i></button>');
      var $rightBtn = $('<button class="side-nav-btn side-right" aria-label="Next page" title="Next (→)"><i class="ti-angle-right"></i></button>');
      $leftBtn.on('click', function(e){ e.stopPropagation(); goPrev(); });
      $rightBtn.on('click', function(e){ e.stopPropagation(); goNext(); });
      $('body').append($leftBtn, $rightBtn);

      // 2) Toolbar arrows inside DFlip toolbar
      // Find the toolbar for this instance. There is only one flipbook here, so select the first .df-ui-bar.
      var $toolbar = $('.df-ui-bar').first();
      if ($toolbar.length){
        var $tPrev = $('<div class="df-ui-btn" role="button" tabindex="0" title="Previous"><i class="ti-angle-left"></i></div>');
        var $tNext = $('<div class="df-ui-btn" role="button" tabindex="0" title="Next"><i class="ti-angle-right"></i></div>');
        $tPrev.on('click keypress', function(e){ if (e.type === 'click' || e.key === 'Enter' || e.key === ' ') goPrev(); });
        $tNext.on('click keypress', function(e){ if (e.type === 'click' || e.key === 'Enter' || e.key === ' ') goNext(); });

        // Insert near the center of the toolbar
        // Prefer to place them at the start; adjust if toolbar groups exist
        $toolbar.prepend($tPrev);
        $toolbar.append($tNext);
      }

      // 3) Keyboard navigation
      $(document).on('keydown.dflipNav', function(e){
        if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
      });
    };
  });
</script>
</body>
</html>
